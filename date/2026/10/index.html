<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/haruhi.png" />
  <title>Monthly LEE JINWOO · 2026년 10월</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --surface: #111111; --surface2: #181818;
      --border: rgba(255,255,255,0.07); --text: rgba(255,255,255,0.87);
      --muted: rgba(255,255,255,0.42);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.6; min-height: 100vh;
    }
    .top-nav {
      border-bottom: 1px solid var(--border); height: 52px;
      display: flex; align-items: center; padding: 0 24px;
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .nav-inner {
      max-width: 880px; width: 100%; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .back-link { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--text); }
    .nav-label { font-size: 12px; color: rgba(255,255,255,0.2); letter-spacing: 0.5px; }
    .hero { max-width: 800px; margin: 0 auto; padding: 72px 24px 56px; text-align: center; }
    .monthly-tag {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(40px, 9vw, 72px); font-weight: 800;
      letter-spacing: -2px; line-height: 1.05;
      background: linear-gradient(160deg, #ffffff 30%, rgba(255,255,255,0.45) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
    }
    .month-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin-top: 36px;
    }
    .month-nav a {
      font-size: 13px; color: var(--muted); text-decoration: none;
      padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); transition: all 0.2s;
    }
    .month-nav a:hover { color: var(--text); border-color: rgba(255,255,255,0.13); }
    .empty-state {
      max-width: 880px; margin: 0 auto; padding: 32px 24px 96px;
      text-align: center; color: var(--muted);
    }
    .empty-box { border: 1px dashed var(--border); border-radius: 18px; padding: 72px 24px; }
    .empty-state h3 { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }
    footer {
      border-top: 1px solid var(--border); padding: 32px 24px;
      text-align: center; font-size: 13px; color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--text); }
    .footer-inner { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .footer-sep { opacity: 0.3; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="../" class="back-link">← 2026</a>
      <span class="nav-label">Monthly LEE JINWOO</span>
    </div>
  </nav>
  <section class="hero">
    <div class="monthly-tag">Monthly LEE JINWOO</div>
    <h1>2026년 10월</h1>
    <div class="month-nav">
      <a href="../09/">← 9월</a>
      <div style="font-size:15px;font-weight:600;color:var(--text)">10월</div>
      <a href="../11/">11월 →</a>
    </div>
  </section>
  <div class="empty-state">
    <div class="empty-box">
      <h3>아직 출시된 앱이 없습니다</h3>
      <p>이 달에는 출시된 앱이 없습니다.</p>
    </div>
  </div>
  <footer>
    <div class="footer-inner">
      <span>© 2026 Nexus11.StandAlone</span>
      <span class="footer-sep">·</span>
      <a href="mailto:nexus11.second@gmail.com">nexus11.second@gmail.com</a>
    </div>
  </footer>
</body>
</html>
